name: Eutrya CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: bash -n scripts/*.sh
      - run: cargo metadata --no-deps --format-version 1 --manifest-path desktop/src-tauri/Cargo.toml > /dev/null
      - run: node -e "JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8'))"
      - run: npm test
