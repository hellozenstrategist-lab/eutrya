name: Eutrya repository bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.eutrya-bootstrap/**'
      - '.github/workflows/eutrya-bootstrap.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild archive and replace repository
        shell: bash
        run: |
          set -euo pipefail
          cat .eutrya-bootstrap/part-* > /tmp/eutrya.b64
          base64 -d /tmp/eutrya.b64 > /tmp/eutrya.zip
          mkdir -p /tmp/eutrya-unpack
          unzip -q /tmp/eutrya.zip -d /tmp/eutrya-unpack
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/eutrya-unpack/eutrya-native/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: replace repository with Eutrya Native v0.2.0 adaptive"
          git push origin HEAD:main
