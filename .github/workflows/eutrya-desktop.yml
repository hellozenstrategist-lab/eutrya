name: Eutrya desktop frontend

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/eutrya-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/eutrya-desktop.yml'

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check desktop/web/app.js
      - name: Verify required frontend files
        run: |
          test -f desktop/web/index.html
          test -f desktop/web/styles.css
          test -f desktop/web/app.js
          test -f desktop/src-tauri/tauri.conf.json
