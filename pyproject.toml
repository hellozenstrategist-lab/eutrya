[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kah-ledger-system"
version = "0.1.0"
description = "Ledger-first coordination layer for Hermes Agent workflows"
requires-python = ">=3.10"
authors = [{ name = "Jimmy Dinh" }]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
kah-ledger = "kah_ledger.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
